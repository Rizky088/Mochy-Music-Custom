name: Fast Debug ARM64

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode (apk = installable APK, kotlin-only = fastest error check)"
        required: true
        default: "apk"
        type: choice
        options:
          - apk
          - kotlin-only

permissions:
  contents: read

concurrency:
  group: fast-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug_arm64:
    name: Fast ARM64 Debug (${{ inputs.mode || 'apk' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK 37
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          if [ ! -d "$SDK_ROOT/platforms/android-37" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            if [ ! -d "$SDK_ROOT/platforms/android-37.0" ]; then
              ("$SDKMANAGER" "platforms;android-37.0" || "$SDKMANAGER" "platforms;android-37") | tr '\r' '\n' | grep -vE '^\[[= ]+\]' || true
            fi
            if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
              ln -sfn android-37.0 "$SDK_ROOT/platforms/android-37"
            fi
          fi

      - name: Restore Persistent Debug Keystore
        env:
          CUSTOM_KEYSTORE_BASE64: ${{ secrets.CUSTOM_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$CUSTOM_KEYSTORE_BASE64" ]; then
            printf '%s' "$CUSTOM_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          elif [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Cache native CMake/NDK build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-debug-arm64-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/CMakeLists.txt') }}
          restore-keys: |
            cxx-debug-arm64-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build ARM64 FOSS Debug
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          STORE_COUNTS_URL: ${{ secrets.STORE_COUNTS_URL }}
        run: |
          if [ "${{ inputs.mode }}" = "kotlin-only" ]; then
            ./gradlew :app:compileArm64FossFastKotlin --build-cache --parallel --console=plain -x lint -x test
          else
            ./gradlew :app:assembleArm64FossFast --build-cache --parallel --console=plain -x lint -x test
          fi

      - name: Upload Debug APK
        if: inputs.mode != 'kotlin-only'
        uses: actions/upload-artifact@v7
        with:
          name: Mochy-Ext-arm64-debug
          path: app/build/outputs/apk/arm64Foss/fast/*.apk
          retention-days: 7
          if-no-files-found: error
