name: Fast Debug ARM64

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode (apk = installable APK, kotlin-only = fastest error check)"
        required: true
        default: "apk"
        type: choice
        options:
          - apk
          - kotlin-only

permissions:
  contents: read

concurrency:
  group: fast-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug_arm64:
    name: Fast ARM64 Debug (${{ inputs.mode || 'apk' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK 37
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          if [ ! -d "$SDK_ROOT/platforms/android-37" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            if [ ! -d "$SDK_ROOT/platforms/android-37.0" ]; then
              "$SDKMANAGER" "platforms;android-37.0" || "$SDKMANAGER" "platforms;android-37"
            fi
            if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
              ln -sfn android-37.0 "$SDK_ROOT/platforms/android-37"
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build ARM64 FOSS Debug
        run: |
          if [ "${{ inputs.mode }}" = "kotlin-only" ]; then
            ./gradlew :app:compileArm64FossDebugKotlin --build-cache --parallel -x lint -x test
          else
            ./gradlew :app:assembleArm64FossDebug --build-cache --parallel -x lint -x test
          fi

      - name: Upload Debug APK
        if: inputs.mode != 'kotlin-only'
        uses: actions/upload-artifact@v7
        with:
          name: Mochy-Ext-arm64-debug
          path: app/build/outputs/apk/arm64Foss/debug/*.apk
          retention-days: 7
          if-no-files-found: error
