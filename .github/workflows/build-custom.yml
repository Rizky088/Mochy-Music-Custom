name: Build Custom ARM64 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_arm64_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate fallback keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Mochy Custom,O=Custom,C=US"

      - name: Build ARM64 FOSS Release APK
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: ./gradlew assembleArm64FossRelease --no-configuration-cache --console=plain --warning-mode summary

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mochy-custom-arm64-release
          path: app/build/outputs/apk/arm64Foss/release/*.apk
          retention-days: 14
