name: Build Custom ARM64 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'store/**'
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_arm64_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Cache native CMake/NDK build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-arm64-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/CMakeLists.txt') }}
          restore-keys: |
            cxx-arm64-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore persistent signing keystore
        env:
          CUSTOM_KEYSTORE_BASE64: ${{ secrets.CUSTOM_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -z "$CUSTOM_KEYSTORE_BASE64" ]; then
            echo "::error::Missing CUSTOM_KEYSTORE_BASE64 secret"
            exit 1
          fi
          printf '%s' "$CUSTOM_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build ARM64 FOSS Release APK
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          STORE_COUNTS_URL: ${{ secrets.STORE_COUNTS_URL }}
        run: ./gradlew assembleArm64FossRelease --build-cache --parallel --no-configuration-cache --console=plain --warning-mode summary

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mochy-custom-arm64-release
          path: app/build/outputs/apk/arm64Foss/release/*.apk
          retention-days: 14
